name: Feature request
description: Something Navia should do.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to do
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Server data it would use
      description: Navia only shows what the server can back up. Which data or endpoint would this come from, if you know?
