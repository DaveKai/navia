[package]
name = "navia-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Desktop integrations for Navia: Discord status and OS media controls."

[dependencies]
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"

# Windows' media controls (SMTC). Linux has its own MPRIS server on zbus (src/mpris.rs), and
# Apple's Now Playing is done on the SwiftUI side.
[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.9.3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }
windows = { version = "0.62", features = ["Networking_Connectivity", "Foundation_Collections"] }

[target.'cfg(target_os = "linux")'.dependencies]
# MPRIS (src/mpris.rs) and the system metered signal.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A test-only MPRIS client.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
